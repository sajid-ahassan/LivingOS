# LivingOps on one laptop: the OFFLINE fallback for the final, or a full local
# stack with your own keys.
#
#   docker compose up --build
#
# Opens: frontend http://localhost:5173, API http://localhost:8000/docs,
# MCP gateway http://localhost:8765/mcp. Local Postgres and Qdrant replace
# Supabase and Qdrant Cloud. DEMO_MODE defaults to OFFLINE: AI answers come
# from data/demo_cache/ (record them in a LIVE rehearsal first) and actions
# run through the in-process mock executor instead of n8n and GitHub.
# Set DEMO_MODE=LIVE and the keys in .env to run against the real services.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livingops
      POSTGRES_USER: livingops
      POSTGRES_PASSWORD: livingops-local   # local container only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livingops -d livingops"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://livingops:livingops-local@postgres:5432/livingops
      # Settings ignore case, so a lowercase key from .env would compete with
      # the one above and could point bootstrap at the hosted database.
      database_url: postgresql://livingops:livingops-local@postgres:5432/livingops
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: local
      DEMO_MODE: ${DEMO_MODE:-OFFLINE}
      # Placeholders so the settings load without real keys in OFFLINE mode.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-offline}
      N8N_PROVISIONING_WEBHOOK: ${N8N_PROVISIONING_WEBHOOK:-http://offline.invalid/webhook}
      N8N_SHARED_TOKEN: ${N8N_SHARED_TOKEN:-offline}
      APP_BASE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    environment:
      LIVINGOPS_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8765:8765"

  frontend:
    build:
      context: frontend
    environment:
      LIVINGOPS_BACKEND: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  qdrant-data:
